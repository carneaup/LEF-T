<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="LEF-T | Bureau d'Études Structure">LEF-T | Bureau d'Études Structure</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html"><h1>LEF-T</h1></a>
                </div>
                <div class="header-right">
                    <nav class="nav-main">
                        <a href="projets.html" data-translate="Projets">Projets</a>
                        <a href="bureau.html" data-translate="Bureau">Bureau</a>
                        <a href="contact.html" data-translate="Contact">Contact</a>
                    </nav>
                    <div class="lang-dropdown">
                        <span class="lang-current" id="lang-current">FR</span>
                        <div class="lang-menu">
                            <a href="#" onclick="changeLanguage('fr')">FR</a>
                            <a href="#" onclick="changeLanguage('en')">EN</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main">
            <h1 class="page-title" data-translate="Nos projets">Nos projets</h1>
            <div class="projects-filters">
                <button class="active" data-translate="Filtrer par">Filtrer par</button>
                <button onclick="filterProjects('all')">Tous</button>
                <button onclick="filterProjects('g1')">G1</button>
                <button onclick="filterProjects('cargo')">Cargo</button>
            </div>
            <div class="projects-mosaic">
                <div class="project-tile">
                    <img src="assets/images/projet-1.jpg" alt="Projet 1">
                    <div class="project-tile-overlay">
                        <h3 data-translate="Projet G1 - Analyse Modale">Projet G1 - Analyse Modale</h3>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/projet-2.jpg" alt="Projet 2">
                    <div class="project-tile-overlay">
                        <h3 data-translate="Projet G1 - Rigidité">Projet G1 - Rigidité</h3>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/projet-3.jpg" alt="Projet 3">
                    <div class="project-tile-overlay">
                        <h3 data-translate="Projet Garching">Projet Garching</h3>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/projet-4.jpg" alt="Projet 4">
                    <div class="project-tile-overlay">
                        <h3 data-translate="Projet Munich">Projet Munich</h3>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-top">
                    <div class="footer-logo">
                        <img src="assets/images/logo_LEF-T.png" alt="LEF-T" class="footer-logo">
                    </div>
                    <div class="footer-links">
                        <a href="projets.html" data-translate="Projets">Projets</a>
                        <a href="bureau.html" data-translate="Bureau">Bureau</a>
                        <a href="contact.html" data-translate="Contact">Contact</a>
                        <a href="legal.html" data-translate="Mentions légales">Mentions légales</a>
                        <a href="charte-graphique.html" data-translate="Charte graphique">Charte graphique</a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p data-translate="LEF-T &copy; 2026">LEF-T &copy; 2026 | <a href="legal.html" data-translate="Privacy Policy">Privacy Policy</a></p>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
