<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEF-T | Projets</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>LEF-T</h1>
                </div>
                <nav class="nav-main">
                    <a href="index.html">Accueil</a>
                    <a href="projets.html" class="active">Projets</a>
                    <a href="bureau.html">Bureau</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <h1 class="page-title">Nos Projets</h1>

            <!-- Menu des typologies -->
            <div class="projects-filters">
                <button class="active">Tous</button>
                <button>Bois</button>
                <button>Toile tendue</button>
                <button>Mobilités douces</button>
                <button>ETFE</button>
                <button>Structure métallique</button>
            </div>

            <!-- Mosaïque des projets -->
            <div class="projects-mosaic">
                <div class="project-tile">
                    <img src="assets/images/Couverture-ETFE_Villejuif.jpg" alt="ETFE Villejuif">
                    <div class="project-overlay">
                        <span class="project-title">ETFE Villejuif</span>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/Urwaldhaus_Muncih.jpg" alt="Urwaldhaus Munich">
                    <div class="project-overlay">
                        <span class="project-title">Urwaldhaus Munich</span>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/aquascope_Poitiers.jpg" alt="Aquascope Poitiers">
                    <div class="project-overlay">
                        <span class="project-title">Aquascope Poitiers</span>
                    </div>
                </div>
                <div class="project-tile">
                    <img src="assets/images/newton_garching_coussins-ETFE.jpg" alt="Newton Garching">
                    <div class="project-overlay">
                        <span class="project-title">Newton Garching</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bandeau inférieur (identique à contact.html et bureau.html) -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-top">
                    <div class="footer-links">
                        <a href="index.html">Accueil</a>
                        <a href="projets.html">Projets</a>
                        <a href="bureau.html">Le Bureau</a>
                        <a href="contact.html">Contact</a>
                        <a href="mentions.html">Mentions légales</a>
                    </div>
                    <div class="lang-switcher">
                        <a href="#" class="active">FR</a>
                        <a href="#">EN</a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>LEF-T &copy; 2026</p>
                    <p>12 Rue de la République, 75011 Paris, France</p>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
