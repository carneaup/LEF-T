<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - LEF-T</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="header"></div>
    
    <main>
        <!-- BLOC FRANÇAIS -->
        <div class="lang-block lang-fr">
            <div class="page-header">
                <h1>Contact</h1>
            </div>
            
            <div class="contact-container">
                <div class="contact-info">
                    <h2>Nous contacter</h2>
                    <p>Email: info@lef-t.eu</p>
                    <p>Téléphone: +33 1 89 29 45 00</p>
                    <p>Adresse: 64, rue de Saintonge, 75003 Paris</p>
                </div>
                
                <div class="contact-form-container">
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="name">Nom</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" required></textarea>
                        </div>
                        <button type="submit">Envoyer</button>
                    </form>
                </div>
            </div>
            
            <div class="map-container"></div>
        </div>

        <!-- BLOC ANGLAIS -->
        <div class="lang-block lang-en" style="display: none;">
            <div class="page-header">
                <h1>Contact</h1>
            </div>
            
            <div class="contact-container">
                <div class="contact-info">
                    <h2>Contact Us</h2>
                    <p>Email: info@lef-t.eu</p>
                    <p>Phone: +33 1 89 29 45 00</p>
                    <p>Address: 64, rue de Saintonge, 75003 Paris</p>
                </div>
                
                <div class="contact-form-container">
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" required></textarea>
                        </div>
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
            
            <div class="map-container"></div>
        </div>
    </main>
    
    <div id="footer"></div>
    
    <script src="../includes/load-includes.js"></script>
    <script src="../script.js"></script>
</body>
</html>
