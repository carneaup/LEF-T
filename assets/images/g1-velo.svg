<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <g transform="translate(400,300)">
    <!-- Cadre du vélo -->
    <path d="M-150,-50 L-50,-50 L0,0 L50,-50 L150,-50 L180,0 L150,50 L50,50 L0,0 L-50,50 L-150,50 L-180,0 Z" fill="#333" stroke="#000" stroke-width="3"/>
    
    <!-- Roue avant -->
    <circle cx="-180" cy="0" r="60" fill="#222" stroke="#000" stroke-width="2"/>
    <circle cx="-180" cy="0" r="40" fill="#444" stroke="#000" stroke-width="1"/>
    <line x1="-180" y1="-60" x2="-180" y2="60" stroke="#000" stroke-width="2"/>
    <line x1="-240" y1="0" x2="-120" y2="0" stroke="#000" stroke-width="2"/>
    
    <!-- Roue arrière -->
    <circle cx="180" cy="0" r="60" fill="#222" stroke="#000" stroke-width="2"/>
    <circle cx="180" cy="0" r="40" fill="#444" stroke="#000" stroke-width="1"/>
    <line x1="180" y1="-60" x2="180" y2="60" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="0" x2="240" y2="0" stroke="#000" stroke-width="2"/>
    
    <!-- Pédales -->
    <circle cx="-30" cy="30" r="8" fill="#555"/>
    <circle cx="-30" cy="-30" r="8" fill="#555"/>
    
    <!-- Guidons -->
    <path d="M-150,-50 L-200,-30 L-150,-10" stroke="#000" stroke-width="4" fill="none"/>
    <path d="M-150,-50 L-200,-70 L-150,-90" stroke="#000" stroke-width="4" fill="none"/>
    
    <!-- Selle -->
    <ellipse cx="0" cy="-80" rx="25" ry="15" fill="#555" stroke="#000" stroke-width="2"/>
    
    <!-- Texte -->
    <text x="0" y="200" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#333">G1 Proto LEICHT</text>
    <text x="0" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#666">Étude de rigidité</text>
  </g>
</svg>
